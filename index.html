<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS Ultimate v2</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { background-color: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; overflow: hidden; }
        .scroll-smooth::-webkit-scrollbar { width: 6px; height: 6px; }
        .scroll-smooth::-webkit-scrollbar-track { background: transparent; }
        .scroll-smooth::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .glass { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select, textarea { background: #18181b; border: 1px solid #27272a; border-radius: 0.5rem; padding: 0.5rem 0.75rem; color: white; outline: none; transition: border 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center;}
        .btn-primary { background: #6366f1; color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-danger { background: #e11d48; color: white; }
        .btn-danger:hover { background: #be123c; }
        .btn-ghost { background: transparent; color: #a1a1aa; border: 1px solid #27272a; }
        .btn-ghost:hover { background: #27272a; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const EXPENSE_CATS = ["Квартира", "Їжа", "Розваги", "Кредити", "Інтернет", "Здоров'я", "Розвиток", "Великі покупки", "Бажання", "Побут", "Комуналка", "Одяг", "Догляд", "Інше"];
        const INCOME_CATS = ["Зарплата", "Бот", "Інше"];
        const WORK_DOC_CATS = ["Отчет", "Графік", "Осмотр об'єктів", "Обладнання", "Стратегія", "Фото"];
        const SPHERES = [
            { id: 'work', name: 'Робота', icon: 'ph-briefcase' },
            { id: 'bot', name: 'Бот', icon: 'ph-robot' },
            { id: 'gamedev', name: 'GameDev', icon: 'ph-game-controller' },
            { id: 'home', name: 'Побут', icon: 'ph-house' }
        ];

        const defaultState = {
            goals: { year: "", month: "", week: "" },
            tasks: [], 
            events: [], 
            notes: { work: "", bot: "", gamedev: "", home: "" },
            links: { work: [], bot: [], gamedev: [], home: [] },
            files: {
                work: { "Отчет": [], "Графік": [], "Осмотр об'єктів": [], "Обладнання": [], "Стратегія": [], "Фото": [] },
                gamedev: { folders: { "Головна": [] } } 
            },
            sports: { plan: "", workouts: [], weightHistory: [] },
            finances: { transactions: [] } 
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                    <div className="bg-[#18181b] border border-[#27272a] rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-fade-in">
                        <div className="flex justify-between items-center p-4 border-b border-[#27272a]">
                            <h2 className="text-xl font-semibold">{title}</h2>
                            <button onClick={onClose} className="text-zinc-400 hover:text-white"><i className="ph ph-x text-2xl"></i></button>
                        </div>
                        <div className="p-4 overflow-y-auto scroll-smooth flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState(defaultState);
            const [activeTab, setActiveTab] = useState('overview');
            const [loaded, setLoaded] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('life_os_ultimate');
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved); 
                        setData(prev => ({
                            ...defaultState,
                            ...parsed,
                            goals: { ...defaultState.goals, ...(parsed.goals || {}) },
                            notes: { ...defaultState.notes, ...(parsed.notes || {}) },
                            links: { ...defaultState.links, ...(parsed.links || {}) },
                            files: {
                                work: { ...defaultState.files.work, ...(parsed.files?.work || {}) },
                                gamedev: { folders: { ...defaultState.files.gamedev.folders, ...(parsed.files?.gamedev?.folders || {}) } }
                            },
                            sports: {
                                plan: parsed.sports?.plan || "",
                                workouts: parsed.sports?.workouts || [],
                                weightHistory: parsed.sports?.weightHistory || []
                            },
                            finances: {
                                transactions: parsed.finances?.transactions || []
                            }
                        }));
                    } 
                    catch(e) { console.error("Data parse error"); }
                }
                setLoaded(true);
            }, []);

            useEffect(() => {
                if (loaded) {
                    localStorage.setItem('life_os_ultimate', JSON.stringify(data));
                }
            }, [data, loaded]);

            const updateData = (updater) => setData(prev => ({ ...prev, ...updater(prev) }));

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `life_os_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importData = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsedData = JSON.parse(event.target.result);
                            setData(parsedData);
                            alert("Дані успішно синхронізовано!");
                        } catch (error) {
                            alert("Файл пошкоджений або має невірний формат.");
                        }
                    };
                }
            };

            const handleTabChange = (tab) => {
                setActiveTab(tab);
                setIsMobileMenuOpen(false);
            };

            if (!loaded) return <div className="flex h-screen items-center justify-center text-white">Завантаження...</div>;

            return (
                <div className="flex flex-col md:flex-row h-screen bg-[#09090b] text-zinc-300 relative overflow-hidden">
                    
                    {/* Мобільний верхній рядок */}
                    <div className="md:hidden flex items-center justify-between p-4 bg-[#18181b] border-b border-[#27272a] z-30 flex-shrink-0">
                        <div className="flex items-center gap-2 text-white font-bold text-lg">
                            <i className="ph-fill ph-planet text-indigo-500"></i> Life OS
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-zinc-300 hover:text-white bg-zinc-800 rounded-lg">
                            <i className="ph ph-list text-2xl"></i>
                        </button>
                    </div>

                    {/* Затемнення фону */}
                    {isMobileMenuOpen && (
                        <div className="fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)}></div>
                    )}

                    {/* Бокове меню */}
                    <aside className={`fixed inset-y-0 left-0 z-50 w-72 glass flex flex-col border-r border-[#27272a] transform transition-transform duration-300 md:relative md:translate-x-0 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 flex justify-between items-center">
                            <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                                <i className="ph-fill ph-planet text-indigo-500"></i> Life OS
                            </h1>
                            <button onClick={() => setIsMobileMenuOpen(false)} className="md:hidden text-zinc-400 hover:text-white">
                                <i className="ph ph-x text-2xl"></i>
                            </button>
                        </div>
                        
                        <nav className="flex-1 px-4 space-y-1 overflow-y-auto scroll-smooth">
                            <NavBtn active={activeTab === 'overview'} onClick={() => handleTabChange('overview')} icon="ph-squares-four" text="Огляд" />
                            <NavBtn active={activeTab === 'calendar'} onClick={() => handleTabChange('calendar')} icon="ph-calendar-blank" text="Календар" />
                            
                            <div className="pt-4 pb-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">Сфери</div>
                            {SPHERES.map(s => (
                                <NavBtn key={s.id} active={activeTab === s.id} onClick={() => handleTabChange(s.id)} icon={s.icon} text={s.name} />
                            ))}

                            <div className="pt-4 pb-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">Лайфстайл</div>
                            <NavBtn active={activeTab === 'sports'} onClick={() => handleTabChange('sports')} icon="ph-barbell" text="Спорт" />
                            <NavBtn active={activeTab === 'finance'} onClick={() => handleTabChange('finance')} icon="ph-wallet" text="Фінанси" />
                        </nav>

                        {/* Синхронізація */}
                        <div className="p-4 border-t border-[#27272a] space-y-2">
                            <div className="text-[10px] text-zinc-500 uppercase font-semibold mb-1">Синхронізація пристроїв</div>
                            <button onClick={exportData} className="w-full btn btn-ghost text-xs py-2"><i className="ph ph-download-simple"></i> Експорт даних</button>
                            <button onClick={() => fileInputRef.current.click()} className="w-full btn btn-ghost text-xs py-2"><i className="ph ph-upload-simple"></i> Імпорт даних</button>
                            <input type="file" ref={fileInputRef} onChange={importData} className="hidden" accept=".json" />
                        </div>
                    </aside>

                    {/* Основний вміст */}
                    <main className="flex-1 overflow-y-auto scroll-smooth relative">
                        <div className="p-4 md:p-8 max-w-7xl mx-auto">
                            {activeTab === 'overview' && <OverviewTab data={data} updateData={updateData} />}
                            {activeTab === 'calendar' && <CalendarTab data={data} />}
                            {SPHERES.map(s => activeTab === s.id && <SphereTab key={s.id} sphere={s.id} title={s.name} data={data} updateData={updateData} />)}
                            {activeTab === 'sports' && <SportsTab data={data} updateData={updateData} />}
                            {activeTab === 'finance' && <FinanceTab data={data} updateData={updateData} />}
                        </div>
                    </main>
                </div>
            );
        };

        const NavBtn = ({ active, onClick, icon, text }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg transition-all ${active ? 'bg-indigo-600/10 text-indigo-400 font-medium' : 'hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200'}`}>
                <i className={`ph ${icon} text-lg`}></i> {text}
            </button>
        );

        const useTaskTimer = (task, onSave) => {
            const [time, setTime] = useState(task.actualTime || 0);

            useEffect(() => {
                let interval;
                if (task.timerActive) {
                    interval = setInterval(() => {
                        const now = Date.now();
                        const elapsed = Math.floor((now - (task.lastStart || now)) / 1000);
                        setTime((task.actualTime || 0) + elapsed);
                    }, 1000);
                } else {
                    setTime(task.actualTime || 0);
                }
                return () => clearInterval(interval);
            }, [task.timerActive, task.lastStart, task.actualTime]);

            const formatTime = (secs) => {
                const h = Math.floor(secs / 3600);
                const m = Math.floor((secs % 3600) / 60);
                const s = secs % 60;
                return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            };

            const toggle = () => {
                const now = Date.now();
                if (task.timerActive) {
                    const elapsed = Math.floor((now - task.lastStart) / 1000);
                    onSave({ timerActive: false, actualTime: (task.actualTime || 0) + elapsed, lastStart: null });
                } else {
                    onSave({ timerActive: true, lastStart: now });
                }
            };

            return { timeFormatted: formatTime(time), toggle, isRunning: task.timerActive };
        };

        const TaskCard = ({ task, onUpdate, onDelete }) => {
            const { timeFormatted, toggle, isRunning } = useTaskTimer(task, (changes) => onUpdate(task.id, changes));

            return (
                <div className="p-3 bg-[#18181b] rounded-lg border border-[#27272a] space-y-2 hover:border-zinc-500 transition-colors">
                    <div className="flex justify-between items-start gap-2">
                        <span className="text-sm font-medium text-white">{task.title}</span>
                        <button onClick={() => onDelete(task.id)} className="text-zinc-500 hover:text-rose-500"><i className="ph ph-trash"></i></button>
                    </div>
                    
                    <div className="text-xs text-zinc-400 flex items-center gap-2">
                        <i className="ph ph-calendar"></i> {task.date}
                        {task.estTime && <span className="bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-300">План: {task.estTime}</span>}
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-zinc-800/60">
                        <div className="flex items-center gap-2">
                            <button onClick={toggle} className={`p-1.5 rounded-full ${isRunning ? 'bg-amber-500 text-black animate-pulse' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'}`}>
                                <i className={`ph-fill ${isRunning ? 'ph-pause' : 'ph-play'} text-xs`}></i>
                            </button>
                            <span className="font-mono text-xs text-zinc-300">{timeFormatted}</span>
                        </div>
                        <select 
                            value={task.status} 
                            onChange={(e) => onUpdate(task.id, { status: e.target.value })}
                            className="text-xs bg-[#27272a] py-1 px-2 rounded text-zinc-300 border-none cursor-pointer"
                        >
                            <option value="todo">Очікує</option>
                            <option value="in_progress">В процесі</option>
                            <option value="done">Виконано</option>
                        </select>
                    </div>
                </div>
            );
        };

        const OverviewTab = ({ data, updateData }) => {
            const doneTasks = data.tasks.filter(t => t.status === 'done').length;
            const totalTasks = data.tasks.length;
            const progress = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);
            const balance = data.finances.transactions.reduce((acc, t) => t.type === 'income' ? acc + Number(t.amount) : acc - Number(t.amount), 0);

            return (
                <div className="space-y-8 animate-fade-in">
                    <h2 className="text-3xl font-bold text-white">Головна панель</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                        <StatCard icon="ph-check-circle" color="text-emerald-400" title="Прогрес задач" value={`${progress}%`} sub={`${doneTasks} / ${totalTasks} виконано`} />
                        <StatCard icon="ph-wallet" color="text-indigo-400" title="Капітал" value={`${balance.toLocaleString()} ₴`} sub="Поточний баланс" />
                        <StatCard icon="ph-kanban" color="text-amber-400" title="В роботі" value={data.tasks.filter(t=>t.status==='in_progress').length} sub="Активних задач" />
                        <StatCard icon="ph-barbell" color="text-rose-400" title="Тренування" value={data.sports.workouts.length} sub="Загальна кількість" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {['year', 'month', 'week'].map(period => (
                            <div key={period} className="glass p-5 rounded-xl flex flex-col">
                                <h3 className="text-lg font-semibold text-white mb-3 capitalize">Цілі на {period === 'year' ? 'Рік' : period === 'month' ? 'Місяць' : 'Тиждень'}</h3>
                                <textarea 
                                    className="w-full flex-1 min-h-[150px] resize-none bg-[#18181b]" 
                                    placeholder="Напишіть цілі..."
                                    value={data.goals[period]}
                                    onChange={(e) => updateData(prev => ({ goals: { ...prev.goals, [period]: e.target.value } }))}
                                />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const StatCard = ({ icon, color, title, value, sub }) => (
            <div className="glass p-5 rounded-xl flex items-center gap-4">
                <div className={`w-12 h-12 rounded-lg bg-zinc-800/50 flex items-center justify-center flex-shrink-0 ${color}`}>
                    <i className={`ph ${icon} text-2xl`}></i>
                </div>
                <div>
                    <div className="text-sm text-zinc-400">{title}</div>
                    <div className="text-2xl font-bold text-white">{value}</div>
                    <div className="text-xs text-zinc-500">{sub}</div>
                </div>
            </div>
        );

        const CalendarTab = ({ data }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDateStr, setSelectedDateStr] = useState(null);

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay();
            const startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const days = [];
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);

            const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

            const handlePrev = () => setCurrentDate(new Date(year, month - 1, 1));
            const handleNext = () => setCurrentDate(new Date(year, month + 1, 1));
            const handleToday = () => setCurrentDate(new Date());

            const getItemsForDate = (d) => {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const t = data.tasks.filter(x => x.date === dateStr);
                const e = data.events.filter(x => x.date === dateStr);
                return { dateStr, tasks: t, events: e };
            };

            const selectedItems = selectedDateStr ? {
                tasks: data.tasks.filter(t => t.date === selectedDateStr),
                events: data.events.filter(e => e.date === selectedDateStr)
            } : null;

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <h2 className="text-3xl font-bold text-white">Календар</h2>
                        <div className="flex items-center gap-2 bg-[#18181b] p-2 rounded-lg border border-[#27272a]">
                            <button onClick={handlePrev} className="p-2 hover:bg-zinc-800 rounded"><i className="ph ph-caret-left"></i></button>
                            <span className="font-semibold text-white w-32 text-center text-sm">{monthNames[month]} {year}</span>
                            <button onClick={handleNext} className="p-2 hover:bg-zinc-800 rounded"><i className="ph ph-caret-right"></i></button>
                            <button onClick={handleToday} className="btn btn-ghost text-xs ml-2">Сьогодні</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-7 gap-1 md:gap-2 mb-2">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(d => <div key={d} className="text-center font-semibold text-zinc-500 py-2 text-xs md:text-sm">{d}</div>)}
                    </div>
                    
                    <div className="grid grid-cols-7 gap-1 md:gap-2">
                        {days.map((d, i) => {
                            if (!d) return <div key={i} className="h-20 md:h-24 bg-[#09090b] rounded-lg"></div>;
                            const { dateStr, tasks, events } = getItemsForDate(d);
                            const isToday = dateStr === new Date().toISOString().split('T')[0];
                            
                            return (
                                <div key={i} onClick={() => setSelectedDateStr(dateStr)} className={`h-20 md:h-24 p-1 md:p-2 rounded-lg border cursor-pointer transition-all overflow-hidden relative flex flex-col ${isToday ? 'bg-indigo-900/20 border-indigo-500' : 'bg-[#18181b] border-[#27272a] hover:border-zinc-500'}`}>
                                    <span className={`text-xs md:text-sm font-bold ${isToday ? 'text-indigo-400' : 'text-zinc-400'}`}>{d}</span>
                                    <div className="flex-1 mt-1 flex flex-col gap-1 overflow-hidden">
                                        {events.slice(0,1).map(e => <div key={e.id} className="text-[9px] md:text-[10px] bg-amber-500/20 text-amber-300 px-1 rounded truncate flex-shrink-0">{e.title}</div>)}
                                        {tasks.slice(0,1).map(t => <div key={t.id} className="text-[9px] md:text-[10px] bg-indigo-500/20 text-indigo-300 px-1 rounded truncate flex-shrink-0">{t.title}</div>)}
                                        {(events.length + tasks.length) > 2 && <div className="text-[9px] text-zinc-500 pl-1">+{events.length + tasks.length - 2} ще</div>}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <Modal isOpen={!!selectedDateStr} onClose={() => setSelectedDateStr(null)} title={`Події на ${selectedDateStr}`}>
                        {selectedItems && (
                            <div className="space-y-6">
                                <div>
                                    <h3 className="font-bold text-amber-400 mb-2 flex items-center gap-2"><i className="ph-fill ph-star"></i> Важливі події</h3>
                                    {selectedItems.events.length === 0 ? <p className="text-zinc-500 text-sm">Немає подій</p> : (
                                        <div className="space-y-2">
                                            {selectedItems.events.map(e => <div key={e.id} className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg text-amber-100">{e.title}</div>)}
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <h3 className="font-bold text-indigo-400 mb-2 flex items-center gap-2"><i className="ph-fill ph-check-square"></i> Задачі</h3>
                                    {selectedItems.tasks.length === 0 ? <p className="text-zinc-500 text-sm">Немає задач</p> : (
                                        <div className="space-y-2">
                                            {selectedItems.tasks.map(t => <div key={t.id} className="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-lg text-indigo-100 flex justify-between"><span>{t.title}</span><span className="text-xs text-indigo-300 opacity-70">{t.sphere}</span></div>)}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const SphereNotesLinks = ({ sphere, data, updateData }) => {
            const [newLinkUrl, setNewLinkUrl] = useState("");
            const [newLinkTitle, setNewLinkTitle] = useState("");

            const notes = data.notes?.[sphere] || "";
            const links = data.links?.[sphere] || [];

            const handleNoteChange = (e) => {

                setNewLinkTitle("");

                updateData(prev => ({ links: { ...prev.links, [sphere]: prev.links[sphere].filter(l => l.id !== id) } }));

                    files: {
                        ...prev.files,
                        work: {

                            [activeCat]: [...(prev.files.work?.[activeCat] || []), newDoc]
                        }
                    }
                }));
                setNewDocText("");
            };

            const deleteDoc = (id) => {
                updateData(prev => ({
                    files: {
                        ...prev.files,
                        work: {
                            ...prev.files.work,
                            [activeCat]: (prev.files.work?.[activeCat] || []).filter(d => d.id !== id)
                        }
                    }
                }));
            };

                            </div>
                        </div>
                    </div>
                </div>

        };

        const SphereTab = ({ sphere, title, data, updateData }) => {
            const tasks = data.tasks.filter(t => t.sphere === sphere);
            const statuses = [
                { id: 'todo', title: 'Очікує', color: 'border-zinc-700' },
                { id: 'in_progress', title: 'В процесі', color: 'border-blue-700' },
                { id: 'done', title: 'Виконано', color: 'border-emerald-700' }
            ];

            const addTask = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const newTask = {
                    id: Date.now().toString(), sphere, status: 'todo',
                    title: fd.get('title'), date: fd.get('date'),
                    estTime: fd.get('estTime'), 
                    actualTime: 0, timerActive: false, lastStart: null
                };
                updateData(prev => ({ tasks: [...prev.tasks, newTask] }));
                e.target.reset();
            };

            const updateTask = (id, changes) => {
                updateData(prev => ({ tasks: prev.tasks.map(t => t.id === id ? { ...t, ...changes } : t) }));
            };
            const deleteTask = (id) => updateData(prev => ({ tasks: prev.tasks.filter(t => t.id !== id) }));

            return (
                <div className="space-y-6">
                    <h2 className="text-3xl font-bold text-white mb-6">{title}</h2>
                    
                    <form onSubmit={addTask} className="glass p-4 rounded-xl flex gap-3 flex-wrap items-end">

                            <input name="title" required placeholder="Що потрібно зробити?" />
                        </div>
                        <div className="w-full sm:w-36 flex flex-col gap-1">
                            <label className="text-xs text-zinc-400">Дата</label>
                            <input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} />

                            <input name="estTime" placeholder="напр. 2h 30m" />

                                </div>

                    {sphere === 'gamedev' && <GameDevAssetManager data={data} updateData={updateData} />}

            );

        const SportsTab = ({ data, updateData }) => {
            const [workoutTitle, setWorkoutTitle] = useState("");
            const [workoutDate, setWorkoutDate] = useState(new Date().toISOString().split('T')[0]);
            const [workoutDuration, setWorkoutDuration] = useState("");
            const [weightValue, setWeightValue] = useState("");
            const [weightDate, setWeightDate] = useState(new Date().toISOString().split('T')[0]);

            const addWorkout = (e) => {
                e.preventDefault();
                if (!workoutTitle.trim()) return;
                const newW = {
                    id: Date.now().toString(),
                    title: workoutTitle,
                    date: workoutDate,
                    duration: workoutDuration || "45 хв"
                };
                updateData(prev => ({ sports: { ...prev.sports, workouts: [newW, ...(prev.sports.workouts || [])] } }));
                setWorkoutTitle("");
                setWorkoutDuration("");
            };

            const addWeight = (e) => {
                e.preventDefault();
                if (!weightValue) return;
                const newEntry = { id: Date.now().toString(), date: weightDate, weight: parseFloat(weightValue) };
                updateData(prev => ({ sports: { ...prev.sports, weightHistory: [newEntry, ...(prev.sports.weightHistory || [])] } }));
                setWeightValue("");
            };

            const deleteWorkout = (id) => updateData(prev => ({ sports: { ...prev.sports, workouts: prev.sports.workouts.filter(w => w.id !== id) } }));
            const deleteWeight = (id) => updateData(prev => ({ sports: { ...prev.sports, weightHistory: prev.sports.weightHistory.filter(w => w.id !== id) } }));

                                        <span className="font-bold text-white">{w.weight} кг</span>

                                            <button onClick={() => deleteWeight(w.id)} className="text-zinc-500 hover:text-rose-500"><i className="ph ph-trash"></i></button>
                                        </div>
                                    </div>

                        <div className="space-y-2 mt-4 max-h-72 overflow-y-auto pr-1">
                            {(data.sports.workouts || []).map(w => (

                                        <div className="text-xs text-zinc-400 flex items-center gap-2 mt-0.5">
                                            <span><i className="ph ph-calendar"></i> {w.date}</span>

        const FinanceTab = ({ data, updateData }) => {
            const [type, setType] = useState('expense');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState(EXPENSE_CATS[0]);
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [comment, setComment] = useState('');

            useEffect(() => {
                setCategory(type === 'expense' ? EXPENSE_CATS[0] : INCOME_CATS[0]);
            }, [type]);

            const transactions = data.finances?.transactions || [];

            const totalIncome = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + Number(t.amount), 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + Number(t.amount), 0);
            const netBalance = totalIncome - totalExpense;

            const addTransaction = (e) => {
                e.preventDefault();
                if (!amount || Number(amount) <= 0) return;
                const newT = {
                    id: Date.now().toString(),
                    type,
                    amount: Number(amount),
                    category,
                    date,
                    comment
                };
                updateData(prev => ({
                    finances: {
                        ...prev.finances,
                        transactions: [newT, ...(prev.finances?.transactions || [])]
                    }
                }));
                setAmount('');
                setComment('');
            };

            const deleteTransaction = (id) => {
                updateData(prev => ({
                    finances: {
                        ...prev.finances,
                        transactions: prev.finances.transactions.filter(t => t.id !== id)
                    }
                }));
            };

            return (
                <div className="space-y-8 animate-fade-in">

                        <StatCard icon="ph-wallet" color="text-indigo-400" title="Капітал / Баланс" value={`${netBalance.toLocaleString()} ₴`} sub="Чистий залишок" />
                        <StatCard icon="ph-arrow-up-right" color="text-emerald-400" title="Доходи" value={`+${totalIncome.toLocaleString()} ₴`} sub="Всього отримано" />
                        <StatCard icon="ph-arrow-down-left" color="text-rose-400" title="Витрати" value={`-${totalExpense.toLocaleString()} ₴`} sub="Всього витрачено" />

                                <select value={type} onChange={e => setType(e.target.value)} className="text-sm">

                                </select>
                            </div>
                            <div className="flex flex-col gap-1">
                                <label className="text-xs text-zinc-400">Дата</label>
                                <input type="date" required value={date} onChange={e => setDate(e.target.value)} className="text-sm" />
                            </div>
                            <div className="flex flex-col gap-1 sm:col-span-2 md:col-span-1">
                                <label className="text-xs text-zinc-400">Коментар</label>
                                <input placeholder="Опис..." value={comment} onChange={e => setComment(e.target.value)} className="text-sm" />
                            </div>
                            <button type="submit" className="btn btn-primary sm:col-span-2 md:col-span-5"><i className="ph ph-plus-circle"></i> Додати запис</button>
                        </form>
                    </div>

                    <div className="glass p-5 rounded-xl space-y-3">
                        <h3 className="text-lg font-semibold text-white mb-2">Історія операцій</h3>
                        <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                            {transactions.length === 0 ? <p className="text-zinc-500 text-xs py-4 text-center">Операцій ще немає</p> : (
                                transactions.map(t => (
                                    <div key={t.id} className="flex justify-between items-center p-3 bg-[#18181b] rounded-lg border border-[#27272a]">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${t.type === 'income' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                <i className={`ph ${t.type === 'income' ? 'ph-arrow-up-right' : 'ph-arrow-down-left'}`}></i>
                                            </div>
                                            <div>
                                                <div className="text-sm font-semibold text-white">{t.category} {t.comment && <span className="text-zinc-400 font-normal">({t.comment})</span>}</div>
                                                <div className="text-[10px] text-zinc-500">{t.date}</div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`font-bold text-sm ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {t.type === 'income' ? '+' : '-'}{Number(t.amount).toLocaleString()} ₴
                                            </span>
                                            <button onClick={() => deleteTransaction(t.id)} className="text-zinc-500 hover:text-rose-500"><i className="ph ph-trash"></i></button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
