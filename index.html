<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life OS Ultimate — Realtime Sync</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Початкові дані за замовчуванням
    const initialData = {
      tasks: [
        { id: '1', title: 'Огляд торгового бота BTC', category: 'Crypto', completed: false, timeSpent: 0 },
        { id: '2', title: 'Перевірити рівень оливи в тракторі', category: 'Workshop', completed: true, timeSpent: 1200 },
        { id: '3', title: 'Оновити текстури в GameDev проєкті', category: 'GameDev', completed: false, timeSpent: 0 }
      ],
      assets: [
        { id: '1', name: 'Player_Model_v2.fbx', folder: '3D Models', date: '2026-08-10', status: 'Готово' },
        { id: '2', name: 'Engine_SFX_Pack.wav', folder: 'Audio', date: '2026-08-11', status: 'В процесі' }
      ],
      maintenance: [
        { id: '1', unit: 'Трактор Т-40', task: 'Заміна гідравлічного фільтра', date: '2026-08-15', status: 'Заплановано' },
        { id: '2', unit: 'Електропідмітач', task: 'Діагностика АКБ', date: '2026-08-09', status: 'Виконано' }
      ],
      finances: [
        { id: '1', title: 'Сервер для бота', amount: -450, category: 'Інфраструктура', date: '2026-08-08' },
        { id: '2', title: 'Дохід від трейдингу', amount: 8200, category: 'Крипто', date: '2026-08-10' }
      ],
      cryptoNotes: {
        botStatus: 'Активний (Long Strategy)',
        macroEma: 'BTC вище EMA 200 на 4H таймфреймі — бичачий тренд',
        riskLimit: '1.5% на угоду'
      },
      lastUpdated: Date.now()
    };

    function App() {
      const [activeTab, setActiveTab] = useState('tasks');
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('life_os_data');
        return saved ? JSON.parse(saved) : initialData;
      });

      // Конфігурація Supabase
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
        const saved = localStorage.getItem('life_os_supabase_config');
        return saved ? JSON.parse(saved) : {
          url: '',
          key: '',
          syncRoom: 'life_os_main_sync'
        };
      });

      const [syncStatus, setSyncStatus] = useState('offline'); // 'synced' | 'syncing' | 'offline' | 'error'
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const supabaseRef = useRef(null);
      const isRemoteUpdateRef = useRef(false);

      // Ініціалізація Supabase клієнта та Realtime-слухача
      useEffect(() => {
        if (!supabaseConfig.url || !supabaseConfig.key) {
          setSyncStatus('offline');
          return;
        }

        try {
          const client = supabase.createClient(supabaseConfig.url, supabaseConfig.key);
          supabaseRef.current = client;

          // Первинне завантаження з хмари
          const fetchInitialCloudData = async () => {
            setSyncStatus('syncing');
            const { data: cloudRow, error } = await client
              .from('life_os_sync')
              .select('*')
              .eq('id', supabaseConfig.syncRoom)
              .single();

            if (cloudRow && cloudRow.payload) {
              isRemoteUpdateRef.current = true;
              setData(cloudRow.payload);
              localStorage.setItem('life_os_data', JSON.stringify(cloudRow.payload));
              setSyncStatus('synced');
              setLastSyncTime(new Date().toLocaleTimeString());
            } else if (!error) {
              // Якщо запису ще немає в базі — створюємо перший з поточними даними
              await client.from('life_os_sync').upsert({
                id: supabaseConfig.syncRoom,
                payload: data,
                updated_at: new Date().toISOString()
              });
              setSyncStatus('synced');
            } else {
              setSyncStatus('synced');
            }
          };

          fetchInitialCloudData();

          // Підписка на миттєві оновлення в реальному часі (Realtime Channel)
          const channel = client
            .channel(`sync-channel-${supabaseConfig.syncRoom}`)
            .on(
              'postgres_changes',
              {
                event: '*',
                schema: 'public',
                table: 'life_os_sync',
                filter: `id=eq.${supabaseConfig.syncRoom}`
              },
              (payload) => {
                if (payload.new && payload.new.payload) {
                  // Перевірка часу, щоб не перезаписувати якщо дані вже нові
                  const incomingPayload = payload.new.payload;
                  isRemoteUpdateRef.current = true;
                  setData(incomingPayload);
                  localStorage.setItem('life_os_data', JSON.stringify(incomingPayload));
                  setSyncStatus('synced');
                  setLastSyncTime(new Date().toLocaleTimeString());
                }
              }
            )
            .subscribe((status) => {
              if (status === 'SUBSCRIBED') {
                setSyncStatus('synced');
              }
            });

          return () => {
            client.removeChannel(channel);
          };
        } catch (err) {
          console.error("Supabase Error:", err);
          setSyncStatus('error');
        }
      }, [supabaseConfig.url, supabaseConfig.key, supabaseConfig.syncRoom]);

      // Автозбереження в хмару при локальних змінах (з debounce 600мс)
      useEffect(() => {
        localStorage.setItem('life_os_data', JSON.stringify(data));

        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        if (!supabaseRef.current || !supabaseConfig.url || !supabaseConfig.key) return;

        setSyncStatus('syncing');
        const timeout = setTimeout(async () => {
          try {
            const payloadToSave = { ...data, lastUpdated: Date.now() };
            const { error } = await supabaseRef.current
              .from('life_os_sync')
              .upsert({
                id: supabaseConfig.syncRoom,
                payload: payloadToSave,
                updated_at: new Date().toISOString()
              });

            if (!error) {
              setSyncStatus('synced');
              setLastSyncTime(new Date().toLocaleTimeString());
            } else {
              console.error(error);
              setSyncStatus('error');
            }
          } catch (e) {
            setSyncStatus('error');
          }
        }, 600);

        return () => clearTimeout(timeout);
      }, [data]);

      // Допоміжні функції оновлення стейту
      const updateData = (updater) => {
        setData(prev => ({
          ...updater(prev),
          lastUpdated: Date.now()
        }));
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* Sidebar / Mobile Nav */}
          <aside className="w-full md:w-64 bg-gray-900 border-b md:border-b-0 md:border-r border-gray-800 p-4 flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between md:justify-start gap-3 mb-6">
                <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2 rounded-xl text-white font-bold text-xl">
                  ⚡
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight tracking-tight">Life OS Ultimate</h1>
                  <p className="text-xs text-gray-400">Синхронізація ПК ⟷ Телефон</p>
                </div>
              </div>

              {/* Статус синхронізації */}
              <div className="mb-6 p-3 rounded-xl bg-gray-950 border border-gray-800 flex items-center justify-between text-xs">
                <div className="flex items-center gap-2">
                  {syncStatus === 'synced' && <span className="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse"></span>}
                  {syncStatus === 'syncing' && <span className="h-2.5 w-2.5 rounded-full bg-amber-500 animate-spin"></span>}
                  {syncStatus === 'offline' && <span className="h-2.5 w-2.5 rounded-full bg-gray-500"></span>}
                  {syncStatus === 'error' && <span className="h-2.5 w-2.5 rounded-full bg-rose-500"></span>}
                  <span className="font-medium text-gray-300">
                    {syncStatus === 'synced' && 'В мережі (Realtime)'}
                    {syncStatus === 'syncing' && 'Синхронізація...'}
                    {syncStatus === 'offline' && 'Локальний режим'}
                    {syncStatus === 'error' && 'Помилка хмари'}
                  </span>
                </div>
                {lastSyncTime && <span className="text-gray-500">{lastSyncTime}</span>}
              </div>

              {/* Меню вкладок */}
              <nav className="flex md:flex-col gap-1 overflow-x-auto pb-2 md:pb-0 custom-scrollbar">
                {[
                  { id: 'tasks', label: '📋 Завдання', desc: 'Справи та таймери' },
                  { id: 'gamedev', label: '🎮 GameDev', desc: 'Асети та файли' },
                  { id: 'workshop', label: '🚜 Майстерня', desc: 'Техніка та ТО' },
                  { id: 'crypto', label: '📈 Крипто & Бот', desc: 'EMA та моніторинг' },
                  { id: 'finance', label: '💰 Фінанси', desc: 'Витрати та доходи' },
                  { id: 'settings', label: '⚙️ Синхронізація', desc: 'Хмарні налаштування' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex-shrink-0 md:w-full text-left px-3.5 py-2.5 rounded-lg transition-all text-sm font-medium ${
                      activeTab === item.id
                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20'
                        : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                    }`}
                  >
                    <div>{item.label}</div>
                  </button>
                ))}
              </nav>
            </div>

            <div className="hidden md:block pt-4 border-t border-gray-800 text-xs text-gray-500">
              Дані миттєво передаються між пристроями по WebSocket
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-4 md:p-8 overflow-y-auto max-w-6xl mx-auto w-full">
            {activeTab === 'tasks' && <TasksView data={data} updateData={updateData} />}
            {activeTab === 'gamedev' && <GameDevView data={data} updateData={updateData} />}
            {activeTab === 'workshop' && <WorkshopView data={data} updateData={updateData} />}
            {activeTab === 'crypto' && <CryptoView data={data} updateData={updateData} />}
            {activeTab === 'finance' && <FinanceView data={data} updateData={updateData} />}
            {activeTab === 'settings' && (
              <SettingsView
                config={supabaseConfig}
                setConfig={(cfg) => {
                  setSupabaseConfig(cfg);
                  localStorage.setItem('life_os_supabase_config', JSON.stringify(cfg));
                }}
                data={data}
                setData={setData}
                syncStatus={syncStatus}
              />
            )}
          </main>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 1: Завдання та трекінг
    // -------------------------------------------------------------
    function TasksView({ data, updateData }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('General');

      const addTask = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          title: title.trim(),
          category,
          completed: false,
          timeSpent: 0
        };
        updateData(prev => ({ ...prev, tasks: [newTask, ...prev.tasks] }));
        setTitle('');
      };

      const toggleTask = (id) => {
        updateData(prev => ({
          ...prev,
          tasks: prev.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t)
        }));
      };

      const deleteTask = (id) => {
        updateData(prev => ({
          ...prev,
          tasks: prev.tasks.filter(t => t.id !== id)
        }));
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold">📋 Менеджер завдань</h2>
              <p className="text-sm text-gray-400">Усі зміни миттєво видно на телефоні та комп'ютері</p>
            </div>
          </div>

          <form onSubmit={addTask} className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row gap-3">
            <input
              type="text"
              placeholder="Нове завдання..."
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500"
            />
            <select
              value={category}
              onChange={(e) => setCategory(e.target.value)}
              className="bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500"
            >
              <option value="General">Загальне</option>
              <option value="Crypto">Крипто / Бот</option>
              <option value="Workshop">Майстерня / Техніка</option>
              <option value="GameDev">GameDev</option>
            </select>
            <button
              type="submit"
              className="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition-all"
            >
              + Додати
            </button>
          </form>

          <div className="grid gap-2">
            {data.tasks.map(task => (
              <div
                key={task.id}
                className={`flex items-center justify-between p-4 rounded-xl border transition-all ${
                  task.completed ? 'bg-gray-900/40 border-gray-900 opacity-60' : 'bg-gray-900 border-gray-800'
                }`}
              >
                <div className="flex items-center gap-3.5 flex-1 min-w-0">
                  <input
                    type="checkbox"
                    checked={task.completed}
                    onChange={() => toggleTask(task.id)}
                    className="h-5 w-5 rounded border-gray-700 bg-gray-950 text-blue-600 cursor-pointer"
                  />
                  <div className="truncate">
                    <span className={`text-sm font-medium ${task.completed ? 'line-through text-gray-500' : 'text-gray-200'}`}>
                      {task.title}
                    </span>
                    <span className="ml-2 text-xs px-2 py-0.5 rounded bg-gray-800 text-gray-400">
                      {task.category}
                    </span>
                  </div>
                </div>
                <button
                  onClick={() => deleteTask(task.id)}
                  className="text-gray-500 hover:text-rose-400 p-1.5 rounded text-sm transition-colors"
                >
                  ✕
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 2: GameDev Asset Manager
    // -------------------------------------------------------------
    function GameDevView({ data, updateData }) {
      const [name, setName] = useState('');
      const [folder, setFolder] = useState('3D Models');

      const addAsset = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        const newAsset = {
          id: Date.now().toString(),
          name: name.trim(),
          folder,
          date: new Date().toISOString().split('T')[0],
          status: 'В роботі'
        };
        updateData(prev => ({ ...prev, assets: [newAsset, ...prev.assets] }));
        setName('');
      };

      const deleteAsset = (id) => {
        updateData(prev => ({ ...prev, assets: prev.assets.filter(a => a.id !== id) }));
      };

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold">🎮 GameDev Репозиторій & Асети</h2>

          <form onSubmit={addAsset} className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row gap-3">
            <input
              type="text"
              placeholder="Назва асету / спрайту / моделі..."
              value={name}
              onChange={(e) => setName(e.target.value)}
              className="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500"
            />
            <select
              value={folder}
              onChange={(e) => setFolder(e.target.value)}
              className="bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500"
            >
              <option value="3D Models">3D Models</option>
              <option value="Textures">Textures</option>
              <option value="Audio">Audio / SFX</option>
              <option value="Scripts">Scripts / Logic</option>
            </select>
            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium">
              + Додати асет
            </button>
          </form>

          <div className="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
            <table className="w-full text-left text-sm">
              <thead className="bg-gray-950/80 text-gray-400 border-b border-gray-800">
                <tr>
                  <th className="p-3.5">Назва файлу</th>
                  <th className="p-3.5">Категорія</th>
                  <th className="p-3.5">Дата</th>
                  <th className="p-3.5 text-right">Дії</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800">
                {data.assets.map(asset => (
                  <tr key={asset.id} className="hover:bg-gray-800/50">
                    <td className="p-3.5 font-medium text-gray-200">{asset.name}</td>
                    <td className="p-3.5"><span className="px-2 py-0.5 rounded bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 text-xs">{asset.folder}</span></td>
                    <td className="p-3.5 text-gray-400 text-xs">{asset.date}</td>
                    <td className="p-3.5 text-right">
                      <button onClick={() => deleteAsset(asset.id)} className="text-gray-500 hover:text-rose-400 text-xs">Видалити</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 3: Майстерня та Обслуговування
    // -------------------------------------------------------------
    function WorkshopView({ data, updateData }) {
      const [unit, setUnit] = useState('Трактор Т-40');
      const [task, setTask] = useState('');

      const addRecord = (e) => {
        e.preventDefault();
        if (!task.trim()) return;
        const newRecord = {
          id: Date.now().toString(),
          unit,
          task: task.trim(),
          date: new Date().toISOString().split('T')[0],
          status: 'Заплановано'
        };
        updateData(prev => ({ ...prev, maintenance: [newRecord, ...prev.maintenance] }));
        setTask('');
      };

      const toggleStatus = (id) => {
        updateData(prev => ({
          ...prev,
          maintenance: prev.maintenance.map(m => m.id === id ? {
            ...m,
            status: m.status === 'Виконано' ? 'Заплановано' : 'Виконано'
          } : m)
        }));
      };

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold">🚜 Обслуговування Техніки & Майстерня</h2>
          
          <form onSubmit={addRecord} className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row gap-3">
            <select
              value={unit}
              onChange={(e) => setUnit(e.target.value)}
              className="bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm"
            >
              <option value="Трактор Т-40">Трактор Т-40</option>
              <option value="Електропідмітач">Електропідмітач</option>
              <option value="Навісне обладнання">Навісне обладнання</option>
              <option value="Інструменти">Інструменти</option>
            </select>
            <input
              type="text"
              placeholder="Що потрібно зробити (напр. заміна мастила)..."
              value={task}
              onChange={(e) => setTask(e.target.value)}
              className="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-sm"
            />
            <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium">
              + Додати ТО
            </button>
          </form>

          <div className="grid gap-3">
            {data.maintenance.map(item => (
              <div key={item.id} className="p-4 rounded-xl bg-gray-900 border border-gray-800 flex justify-between items-center">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-semibold text-gray-200 text-sm">{item.unit}</span>
                    <span className={`text-xs px-2 py-0.5 rounded ${item.status === 'Виконано' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/40' : 'bg-amber-950 text-amber-400 border border-amber-800/40'}`}>
                      {item.status}
                    </span>
                  </div>
                  <p className="text-gray-400 text-sm mt-1">{item.task}</p>
                </div>
                <button
                  onClick={() => toggleStatus(item.id)}
                  className="px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-950 hover:bg-gray-800 text-xs font-medium"
                >
                  {item.status === 'Виконано' ? 'Відновити' : 'Відмітити як зроблене'}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 4: Крипто & Бот Монітор
    // -------------------------------------------------------------
    function CryptoView({ data, updateData }) {
      const notes = data.cryptoNotes || {};

      const handleUpdate = (field, val) => {
        updateData(prev => ({
          ...prev,
          cryptoNotes: {
            ...prev.cryptoNotes,
            [field]: val
          }
        }));
      };

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold">📈 Крипто Бот & Макро-тренд (EMA)</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="p-5 bg-gray-900 border border-gray-800 rounded-xl space-y-3">
              <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Статус роботи бота</label>
              <input
                type="text"
                value={notes.botStatus || ''}
                onChange={(e) => handleUpdate('botStatus', e.target.value)}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500"
              />
            </div>
            <div className="p-5 bg-gray-900 border border-gray-800 rounded-xl space-y-3">
              <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Ризик-менеджмент на сесію</label>
              <input
                type="text"
                value={notes.riskLimit || ''}
                onChange={(e) => handleUpdate('riskLimit', e.target.value)}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500"
              />
            </div>
            <div className="p-5 bg-gray-900 border border-gray-800 rounded-xl space-y-3 md:col-span-2">
              <label className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Аналіз тренду (EMA 50 / 200 & Нотатки)</label>
              <textarea
                rows="4"
                value={notes.macroEma || ''}
                onChange={(e) => handleUpdate('macroEma', e.target.value)}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500"
              />
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 5: Фінанси
    // -------------------------------------------------------------
    function FinanceView({ data, updateData }) {
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [category, setCategory] = useState('Витрати');

      const addTx = (e) => {
        e.preventDefault();
        const num = parseFloat(amount);
        if (!title.trim() || isNaN(num)) return;

        const newTx = {
          id: Date.now().toString(),
          title: title.trim(),
          amount: category === 'Витрати' ? -Math.abs(num) : Math.abs(num),
          category,
          date: new Date().toISOString().split('T')[0]
        };
        updateData(prev => ({ ...prev, finances: [newTx, ...prev.finances] }));
        setTitle('');
        setAmount('');
      };

      const balance = data.finances.reduce((acc, cur) => acc + cur.amount, 0);

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">💰 Фінансовий облік</h2>
            <div className="text-right">
              <span className="text-xs text-gray-400 block">Загальний баланс</span>
              <span className={`text-xl font-bold ${balance >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                {balance > 0 ? `+${balance}` : balance} ₴
              </span>
            </div>
          </div>

          <form onSubmit={addTx} className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row gap-3">
            <input
              type="text"
              placeholder="Опис транзакції..."
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-sm"
            />
            <input
              type="number"
              placeholder="Сума"
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              className="w-full sm:w-32 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-sm"
            />
            <select
              value={category}
              onChange={(e) => setCategory(e.target.value)}
              className="bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 text-sm"
            >
              <option value="Витрати">Витрата (-)</option>
              <option value="Дохід">Дохід (+)</option>
            </select>
            <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium">
              + Додати
            </button>
          </form>

          <div className="space-y-2">
            {data.finances.map(tx => (
              <div key={tx.id} className="p-3.5 bg-gray-900 border border-gray-800 rounded-xl flex justify-between items-center">
                <div>
                  <span className="font-medium text-sm text-gray-200 block">{tx.title}</span>
                  <span className="text-xs text-gray-500">{tx.date}</span>
                </div>
                <span className={`font-semibold text-sm ${tx.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {tx.amount > 0 ? `+${tx.amount}` : tx.amount} ₴
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // МОДУЛЬ 6: Налаштування та Керування Синхронізацією
    // -------------------------------------------------------------
    function SettingsView({ config, setConfig, data, setData, syncStatus }) {
      const [form, setForm] = useState(config);
      const [msg, setMsg] = useState('');

      const handleSave = (e) => {
        e.preventDefault();
        setConfig(form);
        setMsg('✅ Налаштування збережено! Перевірте статус з’єднання.');
        setTimeout(() => setMsg(''), 4000);
      };

      const exportBackup = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `life_os_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            setData(parsed);
            alert('Дані успішно імпортовано!');
          } catch (err) {
            alert('Помилка читання JSON файлу!');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-8">
          <div>
            <h2 className="text-2xl font-bold">⚙️ Налаштування хмарної синхронізації</h2>
            <p className="text-sm text-gray-400">Введіть однакові дані на комп’ютері та телефоні для безперервного зв'язку</p>
          </div>

          <form onSubmit={handleSave} className="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-gray-400 uppercase mb-1">Supabase Project URL</label>
              <input
                type="text"
                placeholder="https://xyzcompany.supabase.co"
                value={form.url}
                onChange={(e) => setForm({ ...form, url: e.target.value.trim() })}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500 font-mono"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-gray-400 uppercase mb-1">Supabase Anon Key (Public Key)</label>
              <input
                type="password"
                placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                value={form.key}
                onChange={(e) => setForm({ ...form, key: e.target.value.trim() })}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500 font-mono"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-gray-400 uppercase mb-1">ID Кімнати / Sync Key (має бути однаковим на обох девайсах)</label>
              <input
                type="text"
                placeholder="my_private_room"
                value={form.syncRoom}
                onChange={(e) => setForm({ ...form, syncRoom: e.target.value.trim() })}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:border-blue-500 font-mono"
              />
            </div>

            {msg && <p className="text-sm text-emerald-400">{msg}</p>}

            <button
              type="submit"
              className="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm"
            >
              Зберегти та підключити
            </button>
          </form>

          {/* Резервне копіювання */}
          <div className="bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-4">
            <h3 className="font-semibold text-gray-200">💾 Локальний бекап (Офлайн)</h3>
            <div className="flex flex-wrap gap-4">
              <button
                onClick={exportBackup}
                className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-sm font-medium"
              >
                📥 Завантажити JSON бекап
              </button>
              <label className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg text-sm font-medium cursor-pointer">
                📤 Відновити з файлу
                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
              </label>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
