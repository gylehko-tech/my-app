<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS Ultimate - Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select { background: #18181b; border: 1px solid #27272a; padding: 0.5rem; color: white; border-radius: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabase = window.supabase.createClient('https://qxodpzmvitxifcsgbk.supabase.co', 'sb_publishable_wRH91J0Yo97BBJoACi1_7g_ynNqmTDy');

        const App = () => {
            const [tab, setTab] = useState('overview');
            const [syncStatus, setSyncStatus] = useState('Підключення...');
            const [data, setData] = useState({
                tasks: [],
                team: { members: ['Користувач 1', 'Користувач 2', 'Користувач 3'], shifts: [] },
                bot: { status: 'Stopped', ema: 0, logs: [] },
                assets: [],
                finance: { items: [] }
            });

            // Завантаження та Realtime підписка
            useEffect(() => {
                const loadData = async () => {
                    const { data: remote, error } = await supabase.from('app_state').select('payload').eq('id', 1).single();
                    if (error) {
                        setSyncStatus('Помилка зʼєднання');
                        console.error(error);
                    } else if (remote && remote.payload && Object.keys(remote.payload).length > 0) {
                        setData(remote.payload);
                        setSyncStatus('Синхронізовано');
                    } else {
                        setSyncStatus('Готовий до роботи');
                    }
                };

                loadData();

                // Слухаємо зміни з інших пристроїв наживо
                const channel = supabase.channel('realtime:app_state')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' }, (payload) => {
                        if (payload.new && payload.new.payload) {
                            setData(payload.new.payload);
                            setSyncStatus('Оновлено щойно');
                        }
                    })
                    .subscribe();

                return () => supabase.removeChannel(channel);
            }, []);

            // Збереження
            const sync = async (newData) => {
                const updated = { ...data, ...newData };
                setData(updated);
                setSyncStatus('Збереження...');
                const { error } = await supabase.from('app_state').upsert({ id: 1, payload: updated });
                if (error) {
                    setSyncStatus('Помилка збереження');
                    console.error(error);
                } else {
                    setSyncStatus('Синхронізовано');
                }
            };

            const NavItem = ({ id, icon, label }) => (
                <button onClick={() => setTab(id)} className={`w-full flex items-center gap-3 p-3 rounded-lg transition-all ${tab === id ? 'bg-indigo-600 text-white shadow-lg' : 'text-zinc-400 hover:bg-zinc-800'}`}>
                    <i className={`ph ph-${icon}`}></i> {label}
                </button>
            );

            return (
                <div className="flex h-screen">
                    <aside className="w-64 glass p-6 border-r border-zinc-800 flex flex-col justify-between">
                        <div>
                            <h1 className="text-xl font-bold mb-6 text-white flex items-center gap-2">
                                <i className="ph ph-sparkle text-indigo-400"></i> Life OS
                            </h1>
                            <nav className="space-y-2">
                                <NavItem id="overview" icon="house" label="Огляд" />
                                <NavItem id="work" icon="broom" label="Facility (Work)" />
                                <NavItem id="bot" icon="robot" label="Trading Bot" />
                                <NavItem id="gamedev" icon="game-controller" label="GameDev" />
                                <NavItem id="finance" icon="wallet" label="Фінанси" />
                            </nav>
                        </div>
                        <div className="text-xs text-zinc-500 flex items-center gap-2 border-t border-zinc-800 pt-3">
                            <div className={`w-2 h-2 rounded-full ${syncStatus === 'Синхронізовано' || syncStatus === 'Оновлено щойно' ? 'bg-green-500' : 'bg-yellow-500'}`}></div>
                            {syncStatus}
                        </div>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        {tab === 'overview' && (
                            <div className="space-y-4">
                                <h2 className="text-3xl font-bold">Головний огляд</h2>
                                <p className="text-zinc-400">Система готова. Оберіть розділ у лівому меню.</p>
                            </div>
                        )}
                        {tab === 'work' && <WorkTab data={data} sync={sync} />}
                        {tab === 'bot' && <BotTab data={data} sync={sync} />}
                        {tab === 'gamedev' && <GamedevTab data={data} sync={sync} />}
                        {tab === 'finance' && <FinanceTab data={data} sync={sync} />}
                    </main>
                </div>
            );
        };

        const WorkTab = ({ data, sync }) => {
            const addShift = (e) => {
                e.preventDefault();
                const worker = e.target.worker.value;
                const task = e.target.task.value;
                if (!task) return;
                const newShift = { id: Date.now(), worker, task };
                sync({ team: { ...data.team, shifts: [...(data.team?.shifts || []), newShift] } });
                e.target.task.value = '';
            };
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold">Facility Maintenance (Команда)</h2>
                    <form onSubmit={addShift} className="glass p-4 rounded-xl flex gap-2">
                        <select name="worker">{data.team?.members?.map(m => <option key={m}>{m}</option>)}</select>
                        <input name="task" placeholder="Задача для зміни..." className="flex-1" />
                        <button className="bg-indigo-600 px-4 py-2 rounded-lg font-medium hover:bg-indigo-500">Додати</button>
                    </form>
                    <div className="grid gap-2">
                        {data.team?.shifts?.map(s => (
                            <div key={s.id} className="bg-zinc-900 border border-zinc-800 p-3 rounded-lg flex justify-between">
                                <span className="font-semibold text-indigo-300">{s.worker}</span>
                                <span className="text-zinc-300">{s.task}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const BotTab = ({ data, sync }) => {
            const toggleBot = () => sync({ bot: { ...data.bot, status: data.bot?.status === 'Running' ? 'Stopped' : 'Running' } });
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-indigo-400">Trading Bot Control</h2>
                    <div className="glass p-6 rounded-xl space-y-4">
                        <div className="text-lg">Статус бота: <span className={data.bot?.status === 'Running' ? 'text-green-400 font-bold' : 'text-red-400 font-bold'}>{data.bot?.status || 'Stopped'}</span></div>
                        <button onClick={toggleBot} className="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-lg font-medium">Перемкнути статус</button>
                        <div className="pt-2">
                            <label className="block text-sm text-zinc-400 mb-1">Показник EMA (Macro Trend):</label>
                            <input type="number" onChange={e => sync({ bot: { ...data.bot, ema: e.target.value } })} value={data.bot?.ema || ''} placeholder="Напр. 65000" />
                        </div>
                    </div>
                </div>
            );
        };

        const GamedevTab = ({ data, sync }) => {
            const addAsset = (e) => {
                e.preventDefault();
                const name = e.target.assetName.value;
                if (!name) return;
                const newAsset = { id: Date.now(), name };
                sync({ assets: [...(data.assets || []), newAsset] });
                e.target.assetName.value = '';
            };
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-purple-400">Game Assets Manager</h2>
                    <form onSubmit={addAsset} className="flex gap-2">
                        <input name="assetName" placeholder="Назва асету..." className="flex-1" />
                        <button className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg font-medium">Додати асет</button>
                    </form>
                    <div className="grid grid-cols-2 gap-3">
                        {data.assets?.map(a => <div key={a.id} className="p-3 bg-zinc-900 border border-purple-900/50 rounded-lg">{a.name}</div>)}
                    </div>
                </div>
            );
        };

        const FinanceTab = ({ data, sync }) => {
            const addTrans = (e) => {
                e.preventDefault();
                const desc = e.target.desc.value;
                const amount = e.target.amount.value;
                if (!desc || !amount) return;
                const item = { id: Date.now(), desc, amount };
                sync({ finance: { items: [...(data.finance?.items || []), item] } });
                e.target.desc.value = '';
                e.target.amount.value = '';
            };
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-emerald-400">Фінанси</h2>
                    <form onSubmit={addTrans} className="flex gap-2">
                        <input name="desc" placeholder="Опис витрати..." className="flex-1" />
                        <input name="amount" type="number" placeholder="Сума (₴)" className="w-32" />
                        <button className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-medium">Додати</button>
                    </form>
                    <div className="space-y-2">
                        {data.finance?.items?.map(i => (
                            <div key={i.id} className="flex justify-between p-3 bg-zinc-900 border border-zinc-800 rounded-lg">
                                <span>{i.desc}</span>
                                <span className="font-semibold text-emerald-400">{i.amount} ₴</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
