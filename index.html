            // 1. Початкове завантаження та Realtime-слухач
            useEffect(() => {
                const fetchRemoteData = async () => {
                    setSyncStatus('Синхронізація...');
                    try {
                        const { data: remote, error } = await supabase
                            .from('app_state')
                            .select('payload')
                            .eq('id', 1)
                            .single();

                        if (error && error.code !== 'PGRST116') {
                            console.error('Fetch error:', error);
                            setSyncStatus('Локальний режим');
                        } else if (remote && remote.payload && Object.keys(remote.payload).length > 0) {
                            setData(remote.payload);
                            localStorage.setItem('life_os_data_v2', JSON.stringify(remote.payload));
                            setSyncStatus('Синхронізовано');
                        } else {
                            // Перший запуск: створюємо перший запис у БД
                            await supabase.from('app_state').upsert({ id: 1, payload: defaultState });
                            setSyncStatus('Базу створено');
                        }
                    } catch (err) {
                        console.error(err);
                        setSyncStatus('Офлайн режим');
                    }
                };

                fetchRemoteData();

                // Live Realtime підписка на будь-які зміни з інших пристроїв
                const channel = supabase
                    .channel('schema-db-changes')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' }, (payload) => {
                        if (payload.new && payload.new.payload) {
                            setData(payload.new.payload);
                            localStorage.setItem('life_os_data_v2', JSON.stringify(payload.new.payload));
                            setSyncStatus('Оновлено наживо');
                            setTimeout(() => setSyncStatus('Синхронізовано'), 2000);
                        }
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, []);

            // 2. Універсальна функція синхронізації
            const updateState = async (updates) => {
                const newState = { ...data, ...updates };
                setData(newState);
                localStorage.setItem('life_os_data_v2', JSON.stringify(newState));
                setIsSaving(true);
                setSyncStatus('Збереження...');

                try {
                    const { error } = await supabase.from('app_state').upsert({ id: 1, payload: newState });
                    if (error) {
                        console.error('Save error:', error);
                        setSyncStatus('Помилка хмари (Збережено локально)');
                    } else {
                        setSyncStatus('Синхронізовано');
                    }
                } catch (e) {
                    setSyncStatus('Збережено локально');
                } finally {
                    setIsSaving(false);
                }

                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    worker,
                    area,
                    machine,

        const FinanceTab = ({ data, updateState }) => {
            const [desc, setDesc] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense');
            const [category, setCategory] = useState('Facility');

            const addTransaction = (e) => {
                e.preventDefault();
                const num = parseFloat(amount);
                if (!desc.trim() || isNaN(num) || num <= 0) return;

                const newTx = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    desc,
                    amount: num,
                    type,
                    category
                };

                const newBalance = type === 'income' ? data.finance.balance + num : data.finance.balance - num;
                const newIncome = type === 'income' ? data.finance.monthlyIncome + num : data.finance.monthlyIncome;
                const newExpenses = type === 'expense' ? data.finance.monthlyExpenses + num : data.finance.monthlyExpenses;

                updateState({
                    finance: {
                        ...data.finance,
                        balance: newBalance,
                        monthlyIncome: newIncome,
                        monthlyExpenses: newExpenses,
                        transactions: [newTx, ...data.finance.transactions]
                    }
                });

                setDesc('');
                setAmount('');
            };

            const deleteTx = (id) => {
                const tx = data.finance.transactions.find(t => t.id === id);
                if (!tx) return;
                const newBalance = tx.type === 'income' ? data.finance.balance - tx.amount : data.finance.balance + tx.amount;
                updateState({
                    finance: {
                        ...data.finance,
                        balance: newBalance,
                        transactions: data.finance.transactions.filter(t => t.id !== id)
                    }
                });
            };

            return (
                <div className="space-y-6">
                    {/* Балансові картки */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="glass-card p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 uppercase font-semibold">Поточний Баланс</span>
                            <div className="text-2xl font-bold text-white mt-1">{data.finance.balance.toLocaleString()} {data.finance.currency}</div>
                        </div>
                        <div className="glass-card p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 uppercase font-semibold">Дохід за місяць</span>
                            <div className="text-2xl font-bold text-emerald-400 mt-1">+{data.finance.monthlyIncome.toLocaleString()} {data.finance.currency}</div>
                        </div>
                        <div className="glass-card p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 uppercase font-semibold">Витрати за місяць</span>
                            <div className="text-2xl font-bold text-rose-400 mt-1">-{data.finance.monthlyExpenses.toLocaleString()} {data.finance.currency}</div>
                        </div>
                    </div>

                    {/* Додати транзакцію */}
                    <form onSubmit={addTransaction} className="glass p-5 rounded-2xl flex flex-col sm:flex-row gap-3">
                        <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Опис транзакції..." className="flex-1 glass-input p-2.5 rounded-xl text-sm" />
                        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="Сума..." className="w-32 glass-input p-2.5 rounded-xl text-sm" />
                        <select value={type} onChange={e => setType(e.target.value)} className="glass-input p-2.5 rounded-xl text-sm">
                            <option value="expense" className="bg-slate-900">Витрата (-)</option>
                            <option value="income" className="bg-slate-900">Дохід (+)</option>
                        </select>
                        <select value={category} onChange={e => setCategory(e.target.value)} className="glass-input p-2.5 rounded-xl text-sm">
                            <option value="Facility" className="bg-slate-900">Facility / Робота</option>
                            <option value="Trading" className="bg-slate-900">Trading Bot</option>
                            <option value="Equipment" className="bg-slate-900">Техніка / Запчастини</option>
                            <option value="Personal" className="bg-slate-900">Особисті</option>
                        </select>
                        <button type="submit" className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm rounded-xl transition">
                            Записати
                        </button>
                    </form>

                    {/* Історія транзакцій */}
                    <div className="glass rounded-2xl overflow-hidden">
                        <div className="p-4 border-b border-slate-800 font-bold text-sm text-slate-300">Останні фінансові операції</div>
                        <div className="divide-y divide-slate-800/60">
                            {data.finance.transactions.map(t => (
                                <div key={t.id} className="p-4 flex items-center justify-between hover:bg-slate-900/40 transition">
                                    <div>
                                        <div className="font-semibold text-slate-200 text-sm">{t.desc}</div>
                                        <div className="text-xs text-slate-400">{t.date} • <span className="text-slate-300">{t.category}</span></div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className={`font-bold text-sm ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}`}>
                                            {t.type === 'income' ? '+' : '-'}{t.amount.toLocaleString()} ₴
                                        </span>
                                        <button onClick={() => deleteTx(t.id)} className="text-slate-500 hover:text-rose-400">
                                            <i className="ph ph-trash text-base"></i>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
